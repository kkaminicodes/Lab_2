<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Conference Registration Form</title>
</head>
<body>

    <h1>Conference Registration Form</h1>

    <form action="#" method="POST">
        Full Name:<br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>

        Email Address:<br>
        <input type="email" id="email" name="email" placeholder="Enter your email addres" required><br><br>
        Age : <br>
        <input type="number" id="age" name="age" value="18" min="18" max="99" required><br><br>

        Gender:<br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        Country of Residence:<br>
        <select id="country" name="country">
            <option value="Malaysia" selected>Malaysia</option>
            <option value="Singapore">Singapore</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Other">Other</option>
        </select><br><br>

        Areas of Interest:<br>
        <input type="checkbox" id="sd" name="interest1" value="Software Development">Software Development
        <br>
        <input type="checkbox" id="ds" name="interest2" value="Data Science">Data Science
        <br>
        <input type="checkbox" id="cs" name="interest3" value="Cybersecurity">Cybersecurity
        <br>
        <input type="checkbox" id="ai" name="interest4" value="Artificial Intelligence">Artificial Intelligence

        <br><br>
        Experience Level:<br>
        <input type="radio" id="beginner" name="exp_level" value="Beginner">
        <label for="beginner">Beginner</label><br>
        <input type="radio" id="intermediate" name="exp_level" value="Intermediate">
        <label for="intermediate">Intermediate</label><br>
        <input type="radio" id="advanced" name="exp_level" value="Advanced">
        <label for="advanced">Advanced</label><br><br>

        Comments or Questions:<br>
        <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Any comments or questions?"></textarea><br><br>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
